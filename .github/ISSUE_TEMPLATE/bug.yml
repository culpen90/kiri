name: Bug report
description: Report a problem with AnythingLLM Mobile or the Stowlark runtime.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Where did the problem happen?
      options:
        - AnythingLLM Mobile
        - Linux (Stowlark) tool on Android
        - Stowlark desktop runtime
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and device
      description: Include the app or runtime version, device model, and operating system version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the screens, settings, or commands needed to see the problem.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened?
      description: Include relevant errors or screenshots. Remove credentials and personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional details
      description: Include any relevant model, provider, or Termux setup details.
