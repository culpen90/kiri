name: Feature request
description: Suggest an improvement to AnythingLLM Mobile or its Linux tools.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: Describe your task and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe the feature you would like to use.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      description: If so, wait until we've agreed on the approach here before opening a pull request.
      options:
        - "No, just suggesting it"
        - "Yes, once we've agreed on the approach"
    validations:
      required: true
